<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curvy& Editorial Review</title>
    <style>
      :root { color:#1c1917; background:#f7f1eb; font-family:Inter,system-ui,sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; }
      header { padding:34px max(24px,5vw) 26px; border-bottom:1px solid #dfd3c8; background:#fcfaf7; }
      h1,h2 { font-family:Georgia,serif; margin:0; }
      h1 { font-size:clamp(32px,5vw,58px); }
      header p { color:#766e68; max-width:720px; line-height:1.6; }
      main { width:min(1180px,92vw); margin:30px auto 80px; }
      .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; }
      .pill { border:1px solid #d7c8bc; border-radius:999px; padding:8px 12px; font-size:12px; background:#fff; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; }
      article { background:#fffdfa; border:1px solid #dfd3c8; border-radius:22px; padding:24px; box-shadow:0 12px 35px rgba(71,51,39,.06); }
      .eyebrow { color:#a85f45; font-size:11px; letter-spacing:.15em; text-transform:uppercase; font-weight:800; }
      h2 { margin-top:9px; font-size:27px; line-height:1.08; }
      .meta,.sources { color:#8a817a; font-size:12px; }
      .summary { color:#514a45; line-height:1.65; }
      details { border-top:1px solid #e9dfd6; margin-top:18px; padding-top:14px; }
      summary { cursor:pointer; font-weight:700; color:#9e5a44; }
      .body { max-height:430px; overflow:auto; padding-right:8px; }
      .body h3 { font-family:Georgia,serif; font-size:20px; margin:20px 0 8px; }
      .body p,.body li { color:#5c554f; line-height:1.55; font-size:14px; }
      .actions { display:flex; gap:10px; margin-top:22px; }
      button { border:0; border-radius:999px; padding:11px 17px; font-weight:800; cursor:pointer; }
      .publish { background:#a85f45; color:#fff; }
      .reject { background:#eee6df; color:#5a5049; }
      button:disabled { opacity:.5; cursor:wait; }
      .empty { padding:60px; text-align:center; border:1px dashed #cdb9aa; border-radius:22px; color:#7d736c; }
      #message { position:fixed; right:22px; bottom:22px; max-width:440px; padding:15px 18px; border-radius:14px; background:#1c1917; color:white; display:none; white-space:pre-wrap; }
      a { color:#9e5a44; }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">Private local workspace</div>
      <h1>Curvy& Editorial Review</h1>
      <p>New research drafts appear here every Monday, Wednesday, and Friday. Nothing reaches the public website until you review it and choose Publish.</p>
    </header>
    <main>
      <div class="toolbar"><strong id="count">Loading drafts…</strong><span class="pill">Local only · Human approval required</span></div>
      <div id="drafts" class="grid"></div>
    </main>
    <div id="message" role="status"></div>
    <script>
      const draftsEl = document.querySelector('#drafts');
      const countEl = document.querySelector('#count');
      const messageEl = document.querySelector('#message');
      const escapeHtml = (value='') => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const showMessage = (text) => { messageEl.textContent=text; messageEl.style.display='block'; setTimeout(()=>messageEl.style.display='none',9000); };
      async function act(slug, action, button) {
        if (action === 'publish' && !confirm('Publish this article to the website and push it to GitHub?')) return;
        if (action === 'reject' && !confirm('Reject and remove this draft?')) return;
        document.querySelectorAll('button').forEach(b => b.disabled=true);
        try {
          const response = await fetch(`/api/editorial/drafts/${encodeURIComponent(slug)}/${action}`, {method:'POST'});
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Action failed');
          showMessage(result.message);
          await load();
        } catch (error) { showMessage(error.message); }
        finally { document.querySelectorAll('button').forEach(b => b.disabled=false); }
      }
      function render(drafts) {
        countEl.textContent = `${drafts.length} draft${drafts.length === 1 ? '' : 's'} waiting for review`;
        if (!drafts.length) { draftsEl.innerHTML='<div class="empty">No drafts are waiting. The next scheduled research run will add new work here.</div>'; return; }
        draftsEl.innerHTML = drafts.map(post => `
          <article>
            <div class="eyebrow">${escapeHtml(post.eyebrow)}</div>
            <h2>${escapeHtml(post.title)}</h2>
            <p class="meta">${escapeHtml(post.publishedAt)} · ${escapeHtml(post.readTime)} · ${post.researchSources?.length || 0} sources</p>
            <p class="summary">${escapeHtml(post.summary)}</p>
            <details><summary>Read complete draft</summary><div class="body">
              ${(post.sections || []).map(s => `<h3>${escapeHtml(s.heading)}</h3>${(s.paragraphs||[]).map(p=>`<p>${escapeHtml(p)}</p>`).join('')}${s.bullets?.length?`<ul>${s.bullets.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:''}`).join('')}
              <h3>Research sources</h3><ul class="sources">${(post.researchSources||[]).map(s=>`<li><a href="${escapeHtml(s.url)}" target="_blank" rel="noreferrer">${escapeHtml(s.label)}</a></li>`).join('')}</ul>
            </div></details>
            <div class="actions"><button class="publish" onclick="act('${escapeHtml(post.slug)}','publish',this)">Approve & Publish</button><button class="reject" onclick="act('${escapeHtml(post.slug)}','reject',this)">Reject</button></div>
          </article>`).join('');
      }
      async function load() {
        const response = await fetch('/api/editorial/drafts');
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not load drafts');
        render(result.drafts);
      }
      load().catch(error => { countEl.textContent='Unable to load'; showMessage(error.message); });
    </script>
  </body>
</html>
